# router.yaml
supergraph:
  listen: 0.0.0.0:4000

cors:
  allow_any_origin: true

# Включаем визуальный интерфейс
sandbox:
  enabled: true

# Включаем домашнюю страницу, которая перенаправит в песочницу
homepage:
  enabled: true

health_check:
  enabled: false

# Или более детально для каждого подграфа, если версия роутера требует:
include_subgraph_errors:
  all: true